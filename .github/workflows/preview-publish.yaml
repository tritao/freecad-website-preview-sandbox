name: Preview publish
on:
  workflow_run:
    workflows: ["Preview build"]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: write
concurrency:
  group: preview-publish-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Validate current pull request
        id: pr
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (!Number.isSafeInteger(number) || number < 1 || pull.state !== 'open' || pull.draft) {
              core.setFailed('Pull request is not open and ready.'); return;
            }
            core.setOutput('number', String(number));
            core.setOutput('sha', pull.head.sha);
            core.setOutput('artifact', `preview-${number}-${pull.head.sha}`);
      - name: Download preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.pr.outputs.artifact }}
          path: ${{ runner.temp }}/preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate static preview
        env:
          PREVIEW_DIR: ${{ runner.temp }}/preview-site
        run: |
          test -f "$PREVIEW_DIR/index.html"
          ! find "$PREVIEW_DIR" -type l -print -quit | grep -q .
          ! find "$PREVIEW_DIR" ! -type d ! -type f -print -quit | grep -q .
          ! find "$PREVIEW_DIR" -name .git -print -quit | grep -q .
      - name: Publish preview
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ${{ runner.temp }}/preview-site
          destination_dir: pr-${{ steps.pr.outputs.number }}
          keep_files: true
          commit_message: Preview PR #${{ steps.pr.outputs.number }} at ${{ steps.pr.outputs.sha }}
      - name: Post preview comment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const marker = `<!-- freecad-website-preview:${number} -->`;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${number}/`;
            const body = `${marker}\n**Preview:** ${url}`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: number, per_page: 100});
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: number, body});
